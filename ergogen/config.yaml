units:
  #Change to choc by changing to cx and cy instead of u
  kx: u
  ky: u
  #Padding
  px: kx + 5
  py: ky + 5
  # Larger Padding Variables
  dpx: kx + 10
  dpy: ky + 10
  # M2 Screw Inserts
  screwSize: 1.5
  standoffSize: 2.5
points:
  key:
    padding: 1ky
    spread: 1kx
  zones:
    main:
       # Fix placement on KiCAD sheet.
      anchor:
        shift: [100, -100]
      key:
        padding: 1ky
        spread: 1kx
      rows:
        bot:
          row_net: P15
        mid:
          row_net: P18
        top:
          row_net: P19
      columns:
        pinkie:
          key:
            column_net: P5
        ring:
          key:
            column_net: P9
            stagger: .4ky
        middle:
          key:
            column_net: P8
            stagger: .2ky
        index:
          key:
            column_net: P7
            stagger: -.2ky    
        index2:
          key:
            column_net: P6
    thumb:
      anchor:
        ref: main_index2_bot
        shift: [1kx,-1.5ky]
        rotate: -30
      rows:
        single:
          row_net: P14
      columns:
        one:
          key:
            width: 1.5kx
            splay: 75
            column_net: P7
        two:  
          key:
            width: 1.5kx   
            shift: [-1kx,-1ky]
            column_net: P6       
        three: 
          key:
            shift: [-2.8kx,1.1ky]
            column_net: P8      
outlines:
  raw:
    - what: rectangle
      where: true
      size: [px, py]
  keys:
    - what: rectangle
      where: true
      size: [kx-0.5,ky-0.5]
  board:
    - what: polygon
      operation: stack
      fillet: 2
      points:
      - ref: main_pinkie_bot
        shift: [-0.5px,-0.5py]
      - ref: main_pinkie_bot
        shift: [0.5px,-0.5py]        
      - ref: main_ring_bot
        shift: [0px,-0.7py]
      - ref: main_index_bot
        shift: [-0.5px,-0.7py]   
      - ref:  thumb_three_single
        shift: [-0.5px,0.5py]
      - ref:  thumb_three_single
        shift: [-0.5px,-0.5py]            
      - ref: thumb_one_single
        shift: [-.5px,-0.5py] 
      - ref: thumb_one_single
        shift: [-.5px,-0.5py] 
      - ref: thumb_two_single
        shift: [-.5px,-0.5py]   
      - ref: thumb_two_single
        shift: [.5px,-0.5py] 
      - ref: main_index2_bot
        shift: [0.8px,-.5py]
      - ref: main_index2_bot
        shift: [1.5px,-.25py]        
      - ref: main_index2_bot
        shift: [1.5px,-.250py]     
      - ref: main_index2_mid
        shift: [1.5px,-.5py]        
      - ref: main_index2_top
        shift: [1.5px,.75py]          
      - ref: main_middle_top
        shift: [-0.5px,0.5py] 
      - ref: main_ring_top
        shift: [-0.5px,0.5py]    
      - ref: main_pinkie_top
        shift: [-0.5px,0.5py]  
      - ref: main_pinkie_bot
        shift: [-0.5px,0.5py]           
  xlboard:
    - what: polygon
      operation: stack
      fillet: 2
      points:
      - ref: main_pinkie_bot
        shift: [-0.5dpx,-0.5dpy]
      - ref: main_pinkie_bot
        shift: [0.5dpx,-0.5dpy]        
      - ref: main_ring_bot
        shift: [0dpx,-0.6dpy]
      - ref: main_index_bot
        shift: [-0.5dpx,-0.6dpy]   
      - ref:  thumb_three_single
        shift: [-0.5dpx,0.5dpy]
      - ref:  thumb_three_single
        shift: [-0.5dpx,-0.5dpy]            
      - ref: thumb_one_single
        shift: [-.5dpx,-0.5dpy] 
      - ref: thumb_one_single
        shift: [-.5dpx,-0.5dpy] 
      - ref: thumb_two_single
        shift: [-.5dpx,-0.5dpy]   
      - ref: thumb_two_single
        shift: [.5dpx,-0.5dpy] 
      - ref: main_index2_bot
        shift: [0.8dpx,-.5dpy]
      - ref: main_index2_bot
        shift: [1.5dpx,-.25dpy]        
      - ref: main_index2_bot
        shift: [1.5dpx,-.250dpy]     
      - ref: main_index2_mid
        shift: [1.5dpx,-.5dpy]        
      - ref: main_index2_top
        shift: [1.5dpx,.75dpy]          
      - ref: main_middle_top
        shift: [-0.5dpx,0.5dpy] 
      - ref: main_ring_top
        shift: [-0.5dpx,0.5dpy]    
      - ref: main_pinkie_top
        shift: [-0.5dpx,0.5dpy]  
      - ref: main_pinkie_bot
        shift: [-0.5dpx,0.5dpy]
  combo:
    - name: board
    - operation: subtract
      name: keys
  mounting:
    - what: circle
      radius: screwSize
      where:
        ref: main_pinkie_top   
        shift:  [-0.25kx, -0.35ky] 
    - what: circle
      radius: screwSize
      where:
        ref: main_index2_top   
        shift:  [-0.25kx, -0.35ky]
    - what: circle
      radius: screwSize
      where:
        ref: main_index2_bot 
        shift:  [.25kx, -2ky]
  standoff:
    - what: circle
      radius: standoffSize
      where:
        ref: main_pinkie_top   
        shift:  [-0.25kx, -0.40ky] 
    - what: circle
      radius: standoffSize
      where:
        ref: main_index2_top   
        shift:  [-0.25kx, -0.40ky]
    - what: circle
      radius: standoffSize
      where:
        ref: main_index2_bot 
        shift:  [.25kx, -2.05ky]        
pcbs:
  petasi:
    template: kicad8 # Required, since footprints are KiCad 8 only
    outlines:
      main:
        outline: board
    footprints:
      mx_hotswap:
        what: mx
        where: true
        params:
          keycaps: true
          hotswap: true
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode:
        what: diode
        where: true
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, -5]          
      nicenano:
        what: mcu_nice_nano
        params:
          reversible: false
          reverse_mount: true
        where:
          ref: main_index2_top
          shift: [1.2kx,-0.1ky]
          #rotate: -90
      niceview:
        what: display_nice_view
        params:
          reversible: false
          MOSI: P2
          SCK: GND
          VCC: VCC # no actual change needed
          GND: P21
          CS: P20
          include_labels: false
        where:
          ref: main_index2_top
          shift: [1.2kx,-0.3ky]
          #rotate: -90          
      reset:
        what: wuerth-434121025816
        params:
          r1: RST
          r2: GND
        where:
          ref: main_index2_top
          shift: [1.20kx,-2.1ky]
          rotate: 0
      powerswitch:
          what: pcm12
          where:
            ref: main_index2_top
            shift: [1.2kx,0.80ky]
            rotate: 180
          params:
            from: pos
            to: RAW
      battery:
          what: jst-s2b-ph-kl
          where:
            ref: main_index2_top
            shift: [1.25kx,-1.6ky]
            rotate: 270
          params:
            neg: GND
      switchviaraw:
          what: via
          where:
            ref: main_index2_top
            shift: [0.8kx,0.8ky]
          params:
            net: RAW
      switchviapos:
          what: via
          where:
            ref: main_index2_top
            shift: [1.62kx,0.8ky]
          params:
            net: pos
      holeTopLeft:
        what: mountinghole
        where:
          ref: main_pinkie_top   
          shift:  [-0.25kx, -1.55ky]
      holeTopRight:
        what: mountinghole
        where:
          ref: main_index2_top   
          shift:  [-0.25kx, -0.55ky]
      holeBottomRight:
        what: mountinghole
        where:
          ref: main_index2_bot 
          shift:  [1.10kx, -2.2ky]
      front_text: &text
          what: text
          where: &textWhere
            ref: main_pinkie_bot 
            shift: [12, -6]
          params: &textParams
            text: petasi\nA keyboard designed by MrRazzle
            justify: left          
cases:
  bottom:
    - name: board
      extrude: 1
  xlbottom:
    - name: xlboard
      extrude: 1
  _outerWall:
    - name: xlboard
      extrude: 7
  _innerWall:
    - name: board
      extrude: 7
  wall:
    - what: case
      name: _outerWall
      operation: add
    - what: case
      name: _innerWall
      operation: subtract
  _holes:
    - name: mounting
      extrude: 4
  _standoffs:
    - name: standoff
      extrude: 4
  case:
    - what: case
      name: _standoffs
      operation: add
    - what: case
      name: _holes
      operation: subtract
    - what: case
      name: xlbottom
      operation: add
    - what: case
      name: wall
      operation: add